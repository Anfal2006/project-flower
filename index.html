<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🍓 Anfal Strawberries Rain 🍓</title>
  <style>
    
    body {
      margin: 0;
      height: 100vh;
      background: black;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* 🍓 الفراولات */
    .strawberry {
      position: absolute;
      width: 40px;
      height: 40px;
      background-image: url('https://cdn-icons-png.flaticon.com/512/590/590685.png');
      background-size: cover;
      background-repeat: no-repeat;
      animation: fall 6s linear infinite;
    }

    /* ✨ الاسم */
    .name {
      position: absolute;
      color: rgb(255, 130, 255);
      font-weight: bold;
      font-size: 1.5em;
      text-shadow: 0 0 15px #ff00ff;
      animation: fall 6s linear infinite;
    }

    /* 💨 حركة السقوط */
    @keyframes fall {
      0% {
        transform: translateY(-50px);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <script>
    const numStrawberries = 25;

    // 🍓 إنشاء الفراولات المتساقطة
    for (let i = 0; i < numStrawberries; i++) {
      const berry = document.createElement("div");
      berry.classList.add("strawberry");
      berry.style.left = Math.random() * 100 + "vw";
      berry.style.animationDuration = 4 + Math.random() * 4 + "s";
      berry.style.width = berry.style.height = 30 + Math.random() * 20 + "px";
      document.body.appendChild(berry);
    }

    // 💖 إنشاء الاسم المتساقط مثل الفراولات
    function createFallingName() {
      const name = document.createElement("div");
      name.classList.add("name");
      name.textContent = "ANFAL 🦢";
      name.style.left = Math.random() * 90 + "vw";
      name.style.animationDuration = 4 + Math.random() * 4 + "s";
      document.body.appendChild(name);
      setTimeout(() => name.remove(), 6000);
    }

    // 🍓 تكرار ظهور الاسم أثناء تساقط الفراولات
    setInterval(createFallingName, 2000);
  </script>
</body>
</html>
